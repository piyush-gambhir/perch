name: Release downloadable package
'on':
  push:
    tags:
    - v*
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@v6
      with:
        version: 12.15.0
    - uses: actions/setup-node@v7
      with:
        node-version: 26.12.1
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - name: Verify version tag
      env:
        TAG: ${{ github.ref_name }}
      run: test "v$(node -p "require('./package.json').version")" = "$TAG"
    - run: pnpm test:security
    - run: pnpm test
    - run: pnpm zip
    - name: Write release notes
      env:
        RELEASE_NOTES: 'Versioned extension ZIP for manual installation. Chrome Web Store publication is separate and requires
          configured publisher identities. Firefox runtime verification is not claimed.


          Made by gpt-6 in Codex

          '
      run: printf '%s' "$RELEASE_NOTES" > release-notes.txt
    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: gh release create "$TAG" .output/*.zip --verify-tag --title "$TAG" --notes-file release-notes.txt
