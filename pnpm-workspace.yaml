# Settings live here in pnpm v10+ (no longer the "pnpm" field in package.json).
# allowBuilds: which dependency build scripts are permitted to run.
allowBuilds:
  sharp: true
  esbuild: true
  spawn-sync: true
# Do not re-check installed deps before every script run (moved from .npmrc).
verifyDepsBeforeRun: false
# Patched transitive versions for open advisories, each scoped to one major.
overrides:
  baseline-browser-mapping@<2.11.0: ^2.11.0
  brace-expansion@<2: ^1.1.21
  brace-expansion@>=5 <6: ^5.0.12
  browserslist@<4.28.7: ^4.28.7
  esbuild@<0.28.1: ^0.28.1
  shell-quote@<1.11.0: ^1.11.0
  source-map-js@<1.2.2: ^1.2.2
  undici@>=7.0.0 <7.30.1: 7.30.1
minimumReleaseAgeExclude:
  - undici@7.30.1
